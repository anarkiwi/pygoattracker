name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pygoattracker tests scripts
      - name: pylint
        run: pylint src/pygoattracker tests scripts
      - name: Cache downloads
        # HVSC tunes, pinned GoatTracker/NinjaTracker fixtures and HVSC's
        # DOCUMENTS/Songlengths.md5 (whole-song render lengths) are copyright and
        # never committed; pysidtracker's cache action persists all of .tunecache.
        uses: anarkiwi/pysidtracker/.github/actions/cache@v0.42.0
        with:
          key: ${{ hashFiles('pyproject.toml', 'tests/data/hvsc_goattracker_sample.txt', 'tests/_fixture_cache.py') }}
          tunes: tests/data/hvsc_goattracker_sample.txt
      - name: pytest + coverage (> 85%)
        run: pytest --cov=pygoattracker --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of the GoatTracker player against the sidtrace
    # sidplayfp oracle over real HVSC tunes. Never skipped: a failed HVSC
    # download or oracle render fails the job. HVSC tunes and oracle CSVs are
    # cached (tunes are copyright and never committed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache tunes and oracle traces
        uses: anarkiwi/pysidtracker/.github/actions/cache@v0.42.0
        with:
          key: ${{ hashFiles('pyproject.toml', 'tests/test_oracle_hvsc.py', 'tests/data/pathdiff.json') }}
          sidtrace: "true"
          tunes: tests/test_oracle_hvsc.py tests/data/pathdiff.json
      - name: Oracle comparison (never skipped)
        run: pytest -m oracle -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pygoattracker; print(pygoattracker.__version__)"
          pygoattracker --help
