name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pygoattracker tests scripts
      - name: pylint
        run: pylint src/pygoattracker tests scripts
      - name: Cache HVSC tunes
        # HVSC corpus tunes are copyright and never committed; the corpus
        # decompile test fetches them from the mirror into a gitignored cache.
        # Cache that dir across runs, keyed on the sample list + fetch script.
        uses: actions/cache@v4
        with:
          path: tests/.tunecache
          key: hvsc-tunes-${{ hashFiles('tests/data/hvsc_goattracker_sample.txt', 'scripts/fetch_tunes.py') }}
      - name: pytest + coverage (> 85%)
        run: pytest --cov=pygoattracker --cov-report=term-missing --cov-fail-under=85

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pygoattracker; print(pygoattracker.__version__)"
          pygoattracker --help
