name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pygoattracker tests scripts
      - name: pylint
        run: pylint src/pygoattracker tests scripts
      - name: Cache HVSC tunes
        # HVSC corpus tunes are copyright and never committed; the corpus
        # decompile test fetches them from the mirror into a gitignored cache.
        # Cache that dir across runs, keyed on the sample list + fetch script.
        uses: actions/cache@v6
        with:
          path: tests/.tunecache
          key: hvsc-tunes-${{ hashFiles('tests/data/hvsc_goattracker_sample.txt', 'scripts/fetch_tunes.py') }}
      - name: pytest + coverage (> 85%)
        run: pytest --cov=pygoattracker --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of the GoatTracker player against the sidtrace
    # sidplayfp oracle over real HVSC tunes. Never skipped: a failed HVSC
    # download or oracle render fails the job. HVSC tunes and oracle CSVs are
    # cached (tunes are copyright and never committed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pull sidtrace oracle image
        id: image
        run: |
          docker pull anarkiwi/sidtrace:latest
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' anarkiwi/sidtrace:latest)
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
      - name: Cache HVSC tunes
        uses: actions/cache@v6
        with:
          path: tests/.tunecache
          key: hvsc-${{ hashFiles('tests/test_oracle_hvsc.py') }}
          restore-keys: hvsc-
      - name: Cache oracle CSVs
        uses: actions/cache@v6
        with:
          path: .oracle-cache/csv
          key: oracle-csv-${{ steps.image.outputs.digest }}-${{ hashFiles('tests/test_oracle_hvsc.py') }}
      - name: Oracle comparison (never skipped)
        run: pytest -m oracle -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pygoattracker; print(pygoattracker.__version__)"
          pygoattracker --help
